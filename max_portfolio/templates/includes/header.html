{% load i18n %}
<nav class="navbar navbar-expand-lg sticky-top glass-nav border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'portfolio:home' %}">{{ site_name }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'portfolio:home' %}">{% trans "Projects" %}</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'portfolio:about' %}">{% trans "Team" %}</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'portfolio:contact' %}">{% trans "Contacts" %}</a></li>
      </ul>

      <form action="{% url 'set_language' %}" method="post" class="d-flex align-items-center me-2">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <select name="language" class="form-select form-select-sm" onchange="this.form.submit()">
          {% get_current_language as CURRENT_LANGUAGE %}
          {% get_available_languages as AVAILABLE_LANGUAGES %}
          {% for lang_code, lang_name in AVAILABLE_LANGUAGES %}
            <option value="{{ lang_code }}" {% if lang_code == CURRENT_LANGUAGE %}selected{% endif %}>{{ lang_name }}</option>
          {% endfor %}
        </select>
      </form>

      <div class="d-flex align-items-center gap-2">
        <button id="themeToggle" type="button" class="btn btn-sm btn-outline-primary" aria-label="{% trans 'Switch theme' %}">
          <span class="theme-icon">🌙</span> {% trans "Theme" %}
        </button>
        {% if user.is_authenticated %}
          <a class="btn btn-primary btn-sm" href="{% url 'portfolio:project_create' %}">+ {% trans "Add project" %}</a>
          <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-outline-secondary btn-sm">{% trans "Log out" %}</button></form>
        {% else %}
          <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">{% trans "Log in" %}</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
