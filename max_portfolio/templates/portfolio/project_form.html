{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "New project" %} | {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <h1 class="h3 mb-3">{% trans "Add new project" %}</h1>
    <form method="post" enctype="multipart/form-data" class="card border-0 shadow-sm p-3 p-md-4">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">{% trans "Save project" %}</button>
        <a href="{% url 'portfolio:home' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
