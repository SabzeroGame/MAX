{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Log in" %} | {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm p-3 p-md-4">
      <h1 class="h4 mb-3">{% trans "Sign in" %}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">{% trans "Log in" %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
